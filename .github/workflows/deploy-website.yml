name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'CNAME'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      - name: Copy CNAME, 404, and Vercel compatibility into build output
        run: |
          cp CNAME website/build/CNAME
          cp website/build/index.html website/build/404.html
          mkdir -p website/build/website
          cp -r website/build/static website/build/website/ 2>/dev/null || true
          cp website/build/index.html website/build/website/index.html
          cat << 'EOF' > website/build/vercel.json
          {
            "framework": null,
            "buildCommand": "echo 'Static assets ready'",
            "outputDirectory": ".",
            "rewrites": [
              {
                "source": "/(.*)",
                "destination": "/index.html"
              }
            ]
          }
          EOF
          cp website/build/vercel.json website/build/website/vercel.json

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/build
          cname: cmameet.site
